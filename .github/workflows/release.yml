name: Publish verified Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag matching the tested application version'
        required: true
        default: 'v0.5.0'
      build_run_id:
        description: 'Successful Test and Windows desktop build run from a main push'
        required: true
        default: ''
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release policy and security evidence validation
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify tested artifact and publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python scripts/publish-release.py
