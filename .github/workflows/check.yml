name: Test and Windows desktop build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore dotnet/MozChecker.Tests --locked-mode
      - run: dotnet test dotnet/MozChecker.Tests --no-restore --configuration Release --logger "trx;LogFileName=core.trx"
      - if: runner.os == 'Windows'
        run: dotnet restore dotnet/MozChecker.Desktop --locked-mode
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - if: runner.os == 'Windows'
        name: Defender validation and native WPF smoke before packaging
        shell: pwsh
        run: |
          ./scripts/test-windows-package-security.ps1 -PackageDirectory "$PWD/dist/MozChecker" -ReportDirectory "$PWD/security-validation" -RemoveRunnerExclusions
          if ($LASTEXITCODE -ne 0) { throw "Windows security validation did not pass" }
          Compress-Archive -Path dist/MozChecker -DestinationPath dist/MozChecker-Windows-x64.zip
          $hash = (Get-FileHash dist/MozChecker-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MozChecker-Windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Item dist/MozChecker-Windows-x64.zip | Select-Object Name, Length
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MozChecker-Windows
          path: |
            dist/MozChecker-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - if: always() && runner.os == 'Windows'
        name: Preserve Windows security validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: Windows-security-validation
          path: security-validation/
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Core-test-results-${{ runner.os }}
          path: dotnet/MozChecker.Tests/TestResults/*.trx
          if-no-files-found: warn
