[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moz-checker"
version = "0.2.0"
description = "Local-first Windows expired-domain research desktop"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<0.29", "dnspython>=2.7,<3", "keyring>=25.6,<26", "idna>=3.10,<4", "tldextract>=5.3,<6"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
moz-checker = "moz_checker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
